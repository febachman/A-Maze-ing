[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator developed for the 42 A-Maze-ing project"
readme = "README.md"
requires-python = ">=3.10"

license = "LicenseRef-Educational-Intra-Project"
license-files = ["LICENSE.md"]

authors = [
    { name = "fbachman" },
    { name = "made-luc" }
]

dependencies = []

[tool.setuptools]
py-modules = [
    "maze_generator",
    "maze_solver"
]